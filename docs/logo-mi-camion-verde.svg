<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Mi Camión Verde" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mi Camión Verde</title>
  <!-- Icono: camión recolector con símbolo de reciclaje -->
  <g stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Chasis amarillo -->
    <rect x="8" y="134" width="212" height="18" rx="7" fill="#F2B84B"/>
    <!-- Compactadora (caja de carga) -->
    <path d="M22 52 H140 L128 136 H14 Z" fill="#6AA829"/>
    <!-- Cabina -->
    <path d="M146 84 H184 L210 112 V136 H146 Z" fill="#6AA829"/>
    <!-- Ventana -->
    <path d="M154 92 H179 L197 112 H154 Z" fill="#C9EEFF"/>
    <!-- Ruedas -->
    <circle cx="56" cy="158" r="22" fill="#4A5A8A"/>
    <circle cx="56" cy="158" r="8" fill="#2B2E5B" stroke="none"/>
    <circle cx="172" cy="158" r="22" fill="#4A5A8A"/>
    <circle cx="172" cy="158" r="8" fill="#2B2E5B" stroke="none"/>
  </g>
  <!-- Símbolo de reciclaje (tres flechas) -->
  <g transform="translate(76 96)">
    <g id="flecha">
      <path d="M3.8 -15.4 L14.25 2.75" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
      <polygon points="17.25,7.95 18.58,0.25 9.92,5.25" fill="#FFFFFF"/>
    </g>
    <use href="#flecha" transform="rotate(120)"/>
    <use href="#flecha" transform="rotate(240)"/>
  </g>
  <!-- Texto -->
  <text x="245" y="106" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800">
    <tspan fill="#2E6B1F">Mi Camión </tspan><tspan fill="#E0A020">Verde</tspan>
  </text>
  <text x="247" y="146" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#4A5A5A">Tu basura en su lugar, el futuro en tus manos.</text>
</svg>
